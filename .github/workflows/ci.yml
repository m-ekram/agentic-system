name: CI

# Runs on every push and every pull request. A red run blocks the merge, which
# is the whole point: the eval suite is only useful if it can stop a regression.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No API key, no secrets. The evals run against the scripted fake client
      # in conftest.py, so CI is free, offline, and gives the same answer every
      # time — a model having an off day can never turn this build red.
      - name: Run the eval suite
        run: pytest -v
