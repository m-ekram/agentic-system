# The deployed MCP server. Caddy terminates TLS and proxies to the app, which is
# never published on a host port. See "Deploying the MCP server" in the README.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   sudo docker compose -f deploy/compose.yaml up -d --build

services:
  mcp:
    build: ..
    command: ["python", "mcp_server.py"]
    env_file: .env
    environment:
      NOTES_MCP_TRANSPORT: http
      NOTES_DIR: /data/notes
      AUDIT_LOG_PATH: /data/audit_log.jsonl
    volumes:
      - notes-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only the hostname. The proxy has no business holding the token.
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp
    restart: unless-stopped

volumes:
  notes-data:
  caddy-data:
  caddy-config:
